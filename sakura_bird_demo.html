<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>봄 테마 — 동박새 애니메이션 예시</title>
<style>
    :root {
        --page-bg-a: #fbf7f4;
        --page-bg-b: #f7e9ef;
        --caption: #9c5c76;
        --caption-strong: #c2255c;
        --ctrl-bg: #ffffff;
        --ctrl-border: #f2c9dc;
        --ctrl-hover: #fdeaf2;
        --widget-shadow: rgba(194, 37, 92, 0.10);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --page-bg-a: #221a20;
            --page-bg-b: #2a1e27;
            --caption: #cf9ab2;
            --caption-strong: #f783ac;
            --ctrl-bg: #322430;
            --ctrl-border: #52394b;
            --ctrl-hover: #3e2c3a;
            --widget-shadow: rgba(0, 0, 0, 0.45);
        }
    }
    :root[data-theme="light"] {
        --page-bg-a: #fbf7f4;
        --page-bg-b: #f7e9ef;
        --caption: #9c5c76;
        --caption-strong: #c2255c;
        --ctrl-bg: #ffffff;
        --ctrl-border: #f2c9dc;
        --ctrl-hover: #fdeaf2;
        --widget-shadow: rgba(194, 37, 92, 0.10);
    }
    :root[data-theme="dark"] {
        --page-bg-a: #221a20;
        --page-bg-b: #2a1e27;
        --caption: #cf9ab2;
        --caption-strong: #f783ac;
        --ctrl-bg: #322430;
        --ctrl-border: #52394b;
        --ctrl-hover: #3e2c3a;
        --widget-shadow: rgba(0, 0, 0, 0.45);
    }

    body {
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 28px;
        background: linear-gradient(160deg, var(--page-bg-a) 0%, var(--page-bg-b) 100%);
        font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        padding: 48px 16px;
    }
    .caption {
        font-size: 13px; color: var(--caption); text-align: center; line-height: 1.7;
    }
    .caption b { color: var(--caption-strong); }

    /* ── 위젯: 가로 1줄(horizontal1) 레이아웃 · sakura 테마 색상 ── */
    .widget {
        width: 392px;
        border-radius: 12px;
        padding: 8px;
        background: #fdf0f5;
        border: 1px solid #f2c9dc;
        box-shadow: 0 10px 30px var(--widget-shadow);
        overflow: visible;
        position: relative;
    }
    .header {
        display: flex; align-items: center;
        padding: 4px 4px 6px; gap: 6px;
    }
    .title { font-size: 12px; font-weight: 700; flex: 1; color: #43202f; }
    .header-btn {
        width: 22px; height: 22px; border: none; background: transparent;
        font-size: 12px; cursor: pointer; border-radius: 4px;
        display: flex; align-items: center; justify-content: center;
        color: #9c5c76;
    }
    .header-btn:hover { background: #fbe4ee; }
    .sep { height: 1px; margin: 0 0 8px; background: #f2c9dc; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn {
        aspect-ratio: 1; border-radius: 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 11px; cursor: pointer; position: relative;
        background: #ffffff; border: 1px solid #f2c9dc; color: #43202f;
        transition: transform .15s ease, background .2s ease;
    }
    .btn:hover { background: #fdeaf2; transform: translateY(-1px); }
    .btn .emoji { font-size: 26px; line-height: 1; }
    .btn .label { margin-top: 4px; font-weight: 500; }
    .btn .sub { font-size: 9px; color: #9c5c76; margin-top: 1px; }

    .plus-wrap { position: relative; }
    .plus {
        aspect-ratio: 1; width: 100%; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; cursor: pointer;
        background: #fdf0f5; border: 1px dashed #f2c9dc; color: #c2255c;
        transition: background .2s ease, border-color .2s ease;
    }
    .plus:hover { background: #fbe4ee; border-color: #c2255c; }

    /* ── 가지+새 장면: 야자수와 동일하게 +버튼 우측 하단 모서리에
       살짝 걸치는 위치 · 폭 48px로 축소 ── */
    .branch-scene {
        position: absolute;
        width: 48px; height: 35px;
        bottom: -7px; right: -6px;  /* 우측 하단 모서리에 걸침 */
        pointer-events: none;
        z-index: 3;
    }
    .branch-scene .branch {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        transform: scaleX(-1);     /* 좌우 반전 → 굵은 밑동이 오른쪽 벽 쪽 */
        filter: drop-shadow(0 2px 3px rgba(67, 32, 47, .18));
    }

    /* 동박새 — 좌우 반전(오른쪽 보기), 꽃 없는 맨 줄기 구간(x 12~26px)에 앉힘 */
    .bird-anchor {
        position: absolute;
        width: 18px;
        left: 15px; top: 1px;      /* 빈 줄기(x≈24px, y≈19px) 지점에 발 */
        z-index: 4;
        opacity: 0;
        transform: scaleX(-1);
    }
    .bird-anchor img {
        display: block; width: 100%;
        transform-origin: 50% 92%;
    }

    /* 1) 스르륵 나타나기 (착지 스쿼시 살짝) */
    .bird-anchor.appear { animation: bird-appear .55s ease-out forwards; }
    @keyframes bird-appear {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    .bird-anchor.appear img { animation: settle .45s ease-out .15s; }
    @keyframes settle {
        0%   { transform: scale(1, .88); }
        55%  { transform: scale(.97, 1.05); }
        100% { transform: scale(1, 1); }
    }

    /* 2) 앉아있기: 고개 갸웃 + 콩콩 (은은하게) */
    .bird-anchor.idle { opacity: 1; }
    .bird-anchor.idle img { animation: idle 2.8s ease-in-out; }
    @keyframes idle {
        0%, 30%, 100% { transform: translate(0,0) rotate(0); }
        12%  { transform: translate(0,0) rotate(-7deg); }   /* 고개 갸웃 */
        46%  { transform: translate(0,-3px) rotate(0); }    /* 콩 */
        52%  { transform: translate(1px,0) rotate(0); }
        66%  { transform: translate(1px,-3px) rotate(5deg); }
        72%  { transform: translate(1px,0) rotate(0); }
    }

    /* 3) 서서히 사라지기 */
    .bird-anchor.fade-out { animation: bird-fade 1.8s ease-in forwards; }
    @keyframes bird-fade {
        from { opacity: 1; }
        to   { opacity: 0; }
    }

    /* 떨어지는 꽃잎 (가지에서 3장) */
    .petal {
        position: absolute; top: 14px; left: 15px; font-size: 6px;
        pointer-events: none; z-index: 2; opacity: 0;
        animation: petal-fall 5.2s linear infinite;
    }
    .petal:nth-of-type(2) { animation-delay: 1.8s; font-size: 5px; left: 30px; }
    .petal:nth-of-type(3) { animation-delay: 3.4s; font-size: 5px; left: 5px; }
    @keyframes petal-fall {
        0%   { opacity: 0; transform: translate(0, 0) rotate(0); }
        8%   { opacity: .85; }
        100% { opacity: 0; transform: translate(-20px, 52px) rotate(210deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        .bird-anchor, .bird-anchor img, .petal { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
        .bird-anchor { opacity: 1; }
    }

    .controls { display: flex; gap: 8px; }
    .controls button {
        border: 1px solid var(--ctrl-border); background: var(--ctrl-bg); color: var(--caption-strong);
        font-size: 12px; font-weight: 600; padding: 7px 14px;
        border-radius: 8px; cursor: pointer;
    }
    .controls button:hover { background: var(--ctrl-hover); }
    .controls button:focus-visible { outline: 2px solid var(--caption-strong); outline-offset: 2px; }
</style>
</head>

<div class="controls">
    <button id="replay">▶ 바로 다시 재생</button>
</div>

<script>
    const bird = document.getElementById('bird');
    let timers = [];

    function clearTimers() { timers.forEach(clearTimeout); timers = []; }

    function setState(cls) {
        bird.className = 'bird-anchor' + (cls ? ' ' + cls : '');
        // 리플로우 강제 → 같은 클래스 재적용 시에도 애니메이션 재시작
        void bird.offsetWidth;
    }

    // 타임라인: 스르륵 나타남(0.55s) → 앉아있기(2.8s) → 서서히 사라짐(1.8s) → 대기 → 반복
    function playCycle(pauseBefore) {
        clearTimers();
        setState('');
        timers.push(setTimeout(() => {
            setState('appear');
            timers.push(setTimeout(() => setState('idle'), 600));
            timers.push(setTimeout(() => setState('fade-out'), 3400));
            timers.push(setTimeout(() => playCycle(nextPause()), 5300));
        }, pauseBefore));
    }

    // 대기 시간 3.5~7초 랜덤 — 매번 똑같은 타이밍이면 기계적으로 보여서
    function nextPause() { return 3500 + Math.random() * 3500; }

    document.getElementById('replay').addEventListener('click', () => playCycle(150));

    playCycle(600);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SupportDeck</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   SupportDeck widget.html — 재작성본
   레이아웃 수치는 main_qtweb.py calc_window_size()와 1:1 대응:
     버튼 100px(작은버튼 60), gap 8(6), pad = gap, border 1, radius 18
   ═══════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

:root {
    /* 테마 변수 — JS(applyTheme)가 config의 theme_data로 채움 */
    --bg:            #0a0a0d;
    --header:        #0f111c;
    --border:        #2a2f44;
    --btn-bg:        #1a1d2e;
    --btn-hover:     #252a44;
    --btn-text:      #e6edf3;
    --btn-sub:       #6e7691;
    --accent:        #58a6ff;
    --danger:        #f85149;
    --plus-bg:       #0f111c;
    --plus-hover:    #1a1d2e;
    --drag-highlight:#58a6ff33;
    /* 레이아웃 변수 — 작은버튼 모드에서 JS가 교체 */
    --btn:    100px;
    --gap:    8px;
    --pad:    8px;
    --radius: 18px;
    --icon-size:  28px;
    --label-size: 11px;
    --hbtn:   22px;
}

html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', sans-serif;
}

/* ── 위젯 컨테이너 ─────────────────────────────────────────── */
#widget-holder { position: absolute; inset: 0; transform-origin: 0 0; }
.widget {
    width: 100%; height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--pad);
    overflow: visible;
    position: relative;
}

/* ── 헤더 (calc_window_size의 header_inner와 일치) ──────────── */
.header {
    display: flex; align-items: center; gap: 2px;
    height: 28px; padding: 4px 4px; margin-bottom: 4px;
    cursor: grab;
}
.header:active { cursor: grabbing; }
.title {
    flex: 1; font-size: 12px; font-weight: 700;
    color: var(--btn-text);
    letter-spacing: 0.4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
}
.title .bolt { color: var(--accent); }
.title.mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
.title.glow { text-shadow: 0 0 8px var(--accent); }
.hbtn {
    width: var(--hbtn); height: var(--hbtn);
    flex: none;
    border: none; background: transparent;
    color: var(--btn-sub);
    font-size: 12px; line-height: 1;
    border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.hbtn:hover { background: var(--btn-hover); color: var(--btn-text); }
.hbtn.pinned { color: var(--accent); }
.hbtn.close:hover { background: var(--danger); color: #fff; }
.sep { height: 1px; background: var(--border); margin-bottom: 8px; }

/* 레이아웃 모드별 헤더 변형 (calc_window_size와 동일 수치) */
body.small .header { height: 20px; padding: 2px 4px; }
body.small .title  { font-size: 11px; }
body.small { --hbtn: 20px; }
body.layout-horizontal1 .header { height: 22px; padding: 2px 4px; margin-bottom: 2px; }
body.layout-horizontal1 .sep    { margin-bottom: 4px; }
body.layout-horizontal1.small .header { height: 20px; }
body.layout-vertical1 .header {
    flex-wrap: wrap; height: auto;
    padding: 6px 4px 0; margin-bottom: 4px; gap: 2px;
}
body.layout-vertical1 .title { flex: 1 0 100%; height: 18px; font-size: 12px; }
body.layout-vertical1.small .title { height: 14px; font-size: 10px; }

/* ── 버튼 그리드 ───────────────────────────────────────────── */
.grid { display: grid; gap: var(--gap); }

.btn {
    width: var(--btn); height: var(--btn);
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: var(--btn-text);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    overflow: hidden;
}
.btn:hover { background: var(--btn-hover); transform: translateY(-1px); border-color: var(--accent); }
.btn:active { transform: translateY(0) scale(0.97); }
.btn .icon { font-size: var(--icon-size); line-height: 1; }
.btn .icon img {
    width: calc(var(--btn) * 0.52); height: calc(var(--btn) * 0.52);
    object-fit: cover; border-radius: 8px; display: block;
}
.btn .label {
    font-size: var(--label-size); font-weight: 600;
    max-width: calc(100% - 10px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn .sub {
    font-size: 9px; color: var(--btn-sub);
    max-width: calc(100% - 10px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.small .btn { gap: 1px; }
body.small .btn .sub { display: none; }
body.small { --icon-size: 20px; --label-size: 9px; }

/* 게이밍 테마: 네온 글로우 */
body.kind-gaming .btn:hover { box-shadow: 0 0 10px var(--accent)55, inset 0 0 6px var(--accent)22; }
/* 글래스 테마: 반투명 */
body.kind-glass .widget { background: color-mix(in srgb, var(--bg) 88%, transparent); }
body.kind-glass .btn { background: color-mix(in srgb, var(--btn-bg) 80%, transparent); }
/* 라이트 계열: 은은한 그림자 */
body.kind-light .btn { box-shadow: 0 1px 3px rgba(0,0,0,.06); }

/* 폴더 그룹 버튼: 4분할 아이콘 */
.btn .folder-quad {
    width: calc(var(--icon-size) + 8px); height: calc(var(--icon-size) + 8px);
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
}
.btn .folder-quad i { border-radius: 4px; opacity: .9; }

/* 드래그 재정렬 */
.btn.drag-src { opacity: .35; }
.btn.drag-over { border-color: var(--accent); background: var(--drag-highlight); }

/* +버튼 / 뒤로가기 */
.plus-wrap { position: relative; width: var(--btn); height: var(--btn); }
.plus, .back {
    width: 100%; height: 100%;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.plus {
    background: var(--plus-bg);
    border: 1px dashed var(--border);
    color: var(--btn-sub);
}
.plus:hover { background: var(--plus-hover); border-color: var(--accent); color: var(--accent); }
.plus.drop-target { background: var(--drag-highlight); border-color: var(--accent); color: var(--accent); }
.back {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: var(--btn-sub);
    font-size: 20px;
}
.back:hover { background: var(--btn-hover); color: var(--btn-text); border-color: var(--accent); }

/* ═══════════════════════════════════════════════════════════════
   계절 장식 — 파티클(꽃잎/파도/낙엽/눈) + 마스코트
   setPetalsPaused(true) → body.petals-paused
   ═══════════════════════════════════════════════════════════════ */
#season-layer {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
    border-radius: var(--radius);
    z-index: 5;
}
body.petals-paused #season-layer *,
body.minimized #season-layer * { animation-play-state: paused !important; }

.particle {
    position: absolute; top: -20px;
    pointer-events: none; opacity: 0;
    animation: particle-fall linear infinite;
}
@keyframes particle-fall {
    0%   { opacity: 0; transform: translate(0, -10px) rotate(0); }
    6%   { opacity: .9; }
    90%  { opacity: .8; }
    100% { opacity: 0; transform: translate(var(--drift, -30px), var(--fall, 300px)) rotate(var(--spin, 200deg)); }
}
/* 여름: 파도 — 위젯 하단에서 넘실 */
.wave {
    position: absolute; left: -20%; right: -20%; bottom: -14px;
    height: 26px; border-radius: 45%;
    background: var(--accent);
    opacity: .10;
    animation: wave-roll 6s ease-in-out infinite;
}
.wave.w2 { bottom: -18px; opacity: .07; animation-duration: 8.5s; animation-delay: -2s; }
@keyframes wave-roll {
    0%, 100% { transform: translateX(-14px) scaleY(1); }
    50%      { transform: translateX(14px) scaleY(1.25); }
}

/* 마스코트 장면 — +버튼 우측 하단 모서리에 살짝 걸침 (확정 스펙) */
.mascot-scene {
    position: absolute;
    bottom: -5px; right: -4px;  /* 우측 하단 걸침 — 창 라운드 코너(18px)에 잘리지 않는 한도 */
    pointer-events: none;
    z-index: 6;
}
.mascot-scene img { display: block; image-rendering: -webkit-optimize-contrast; }

/* ── 봄: 벚꽃 가지(좌우반전·굵은쪽 벽) + 동박새 v8 ── */
.scene-spring { width: 48px; height: 35px; }
.scene-spring .branch {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform: scaleX(-1);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
}
.scene-spring .bird {
    position: absolute; width: 18px;
    left: 15px; top: -1px;              /* 확정 좌표 v8 */
    transform: scaleX(-1);
    transform-origin: 50% 92%;
    opacity: 0;
}
.scene-spring .bird.appear { animation: bird-appear .55s ease-out forwards; }
@keyframes bird-appear { from { opacity: 0; } to { opacity: 1; } }
.scene-spring .bird.appear img { animation: bird-settle .45s ease-out .15s; }
@keyframes bird-settle {
    0% { transform: scale(1,.88); } 55% { transform: scale(.97,1.05); } 100% { transform: scale(1,1); }
}
.scene-spring .bird.idle { opacity: 1; }
.scene-spring .bird.idle img { animation: bird-idle 2.8s ease-in-out; }
@keyframes bird-idle {
    0%, 30%, 100% { transform: translate(0,0) rotate(0); }
    12% { transform: translate(0,0) rotate(-7deg); }
    46% { transform: translate(0,-3px) rotate(0); }
    52% { transform: translate(1px,0) rotate(0); }
    66% { transform: translate(1px,-3px) rotate(5deg); }
    72% { transform: translate(1px,0) rotate(0); }
}
.scene-spring .bird.fade-out { animation: bird-fade 1.8s ease-in forwards; }
@keyframes bird-fade { from { opacity: 1; } to { opacity: 0; } }

/* ── 여름: 야자수 + 점프 돌고래 ── */
.scene-summer { width: 52px; height: 44px; }
.scene-summer .palm { position: absolute; right: 0; bottom: 0; font-size: 30px; line-height: 1; }
.scene-summer .dolphin {
    position: absolute; width: 30px; left: -6px; bottom: 0;
    opacity: 0;
}
.scene-summer .dolphin.jump { animation: dolphin-jump 1.6s ease-in-out forwards; }
@keyframes dolphin-jump {
    0%   { opacity: 0; transform: translate(14px, 16px) rotate(30deg); }
    15%  { opacity: 1; }
    50%  { transform: translate(-2px, -14px) rotate(-10deg); }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-20px, 14px) rotate(-45deg); }
}

/* ── 가을: 다람쥐 + 도토리 ── */
.scene-autumn { width: 52px; height: 40px; }
.scene-autumn .squirrel { position: absolute; right: 0; bottom: 0; width: 40px; }
.scene-autumn .acorn {
    position: absolute; width: 13px; left: 0; top: -4px; opacity: 0;
}
.scene-autumn .acorn.drop { animation: acorn-drop 1.5s cubic-bezier(.5,0,.7,.4) forwards; }
@keyframes acorn-drop {
    0%   { opacity: 0; transform: translateY(-8px) rotate(0); }
    12%  { opacity: 1; }
    70%  { transform: translateY(26px) rotate(160deg); }
    80%  { transform: translateY(20px) rotate(200deg); }
    100% { opacity: 0; transform: translateY(28px) rotate(240deg); }
}

/* ── 겨울: 뒤뚱뒤뚱 펭귄 ── */
.scene-winter { width: 60px; height: 34px; }
.scene-winter .penguin {
    position: absolute; width: 24px; bottom: 0; right: 0;
    opacity: 0;
}
.scene-winter .penguin.waddle { animation: penguin-waddle 5.5s ease-in-out forwards; }
@keyframes penguin-waddle {
    0%   { opacity: 0; transform: translateX(18px) rotate(0); }
    8%   { opacity: 1; }
    15%  { transform: translateX(10px) rotate(-6deg); }
    25%  { transform: translateX(2px)  rotate(6deg); }
    35%  { transform: translateX(-8px) rotate(-6deg); }
    45%  { transform: translateX(-16px) rotate(6deg); }
    55%  { transform: translateX(-24px) rotate(-4deg); }
    62%  { transform: translateX(-28px) rotate(0); }
    78%  { transform: translateX(-28px) rotate(0); }   /* 잠깐 멈춰 두리번 */
    86%  { transform: translateX(-28px) rotate(-8deg); }
    100% { opacity: 0; transform: translateX(-40px) rotate(0); }
}

/* ═══════════════════════════════════════════════════════════════
   인트로 (setupIntro → playIntroMove → introBuild → introIconFade → introSettle)
   ═══════════════════════════════════════════════════════════════ */
#intro-icon {
    position: absolute;
    display: none;
    pointer-events: none;
    z-index: 50;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.45));
    will-change: transform, opacity;
}
#intro-icon img { width: 100%; height: 100%; display: block; }
body.intro #widget-holder { opacity: 0; }
</style>
</head>
<body>

<div id="widget-holder">
    <div class="widget" id="widget">
        <div class="header" id="header">
            <div class="title" id="title"><span class="bolt">⚡</span> SUPPORTDECK</div>
            <button class="hbtn" id="btn-pin"      title="항상 위">📌</button>
            <button class="hbtn" id="btn-settings" title="설정">⚙</button>
            <button class="hbtn" id="btn-min"      title="가장자리로 숨김">─</button>
            <button class="hbtn close" id="btn-close" title="종료">✕</button>
        </div>
        <div class="sep"></div>
        <div class="grid" id="grid"></div>
        <div id="season-layer"></div>
    </div>
</div>

<div id="intro-icon"><img src="icon_splash.png" alt=""></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════════════════════ */
let bridge = null;
let CFG = null;            // 마지막으로 받은 config/refresh payload
let curButtons = [];       // 현재 컨텍스트 버튼 목록
let inFolder = false;
let mascotTimers = [];
let decoPaused = false;

/* ═══════════════════════════════════════════════════════════════
   브리지 연결
   ═══════════════════════════════════════════════════════════════ */
function connectBridge() {
    if (typeof qt !== "undefined" && typeof QWebChannel !== "undefined") {
        new QWebChannel(qt.webChannelTransport, function (ch) {
            bridge = ch.objects.bridge;
            bridge.get_config(function (json) {
                try { initFromConfig(JSON.parse(json)); }
                catch (e) { console.error("config parse 실패", e); }
            });
        });
    } else {
        // 브라우저 단독 테스트: window.__mockConfig가 있으면 사용
        if (window.__mockConfig) initFromConfig(window.__mockConfig);
    }
}

function initFromConfig(cfg) {
    const folder = cfg._current_folder || {};
    const payload = {
        buttons: (folder.id != null ? folder.buttons : cfg.buttons) || [],
        folder: { id: folder.id ?? null, label: folder.label ?? null },
        layout_mode: cfg.layout_mode || "grid2",
        theme: cfg.theme,
        theme_data: cfg.theme_data || {},
        bg_color: cfg.bg_color,
        small_buttons: !!cfg.small_buttons,
    };
    applyAll(payload);
}

/* Python → refreshButtons(jsonString) */
window.refreshButtons = function (jsonStr) {
    try { applyAll(JSON.parse(jsonStr)); }
    catch (e) { console.error("refreshButtons parse 실패", e); }
};

/* ═══════════════════════════════════════════════════════════════
   테마/레이아웃 적용
   ═══════════════════════════════════════════════════════════════ */
function applyTheme(t, bgColor) {
    const r = document.documentElement.style;
    const set = (k, v) => { if (v) r.setProperty(k, v); };
    set("--bg",             bgColor || t.bg);
    set("--header",         t.header);
    set("--border",         t.border);
    set("--btn-bg",         t.btn_bg);
    set("--btn-hover",      t.btn_hover);
    set("--btn-text",       t.btn_text);
    set("--btn-sub",        t.btn_sub);
    set("--accent",         t.accent);
    set("--danger",         t.danger);
    set("--plus-bg",        t.plus_bg);
    set("--plus-hover",     t.plus_hover);
    set("--drag-highlight", t.drag_highlight);

    // style_kind 클래스
    document.body.className = document.body.className.replace(/\bkind-\S+/g, "").trim();
    if (t.style_kind) document.body.classList.add("kind-" + t.style_kind);

    // 타이틀 폰트/글로우
    const title = document.getElementById("title");
    title.classList.toggle("mono", t.title_font === "mono");
    title.classList.toggle("glow", !!t.title_glow);
}

function applyAll(p) {
    CFG = p;
    curButtons = p.buttons || [];
    inFolder = p.folder && p.folder.id != null;

    // 레이아웃 클래스
    const b = document.body;
    b.classList.toggle("small", !!p.small_buttons);
    b.className = b.className.replace(/\blayout-\S+/g, "").trim();
    b.classList.add("layout-" + (p.layout_mode || "grid2"));

    // 작은버튼 변수
    const r = document.documentElement.style;
    r.setProperty("--btn", p.small_buttons ? "60px" : "100px");
    r.setProperty("--gap", p.small_buttons ? "6px" : "8px");
    r.setProperty("--pad", p.small_buttons ? "6px" : "8px");

    applyTheme(p.theme_data || {}, p.bg_color);

    // 타이틀: 폴더 안이면 폴더명
    const title = document.getElementById("title");
    title.innerHTML = inFolder
        ? "📁 " + escapeHtml(p.folder.label || "폴더")
        : '<span class="bolt">⚡</span> SUPPORTDECK';

    // 순서 중요: setupSeason이 마스코트 타이머를 초기화하므로
    // 마스코트를 마운트하는 renderGrid보다 먼저 호출해야 함
    setupSeason(p.theme);
    renderGrid(p);
}

/* ═══════════════════════════════════════════════════════════════
   그리드 렌더
   ═══════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g,
        c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function luminance(hex) {
    const m = /^#?([0-9a-f]{6})/i.exec(hex || "");
    if (!m) return 0;
    const n = parseInt(m[1], 16);
    return (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}

function fileUrl(p) {
    if (!p) return "";
    return "file:///" + String(p).replace(/\\/g, "/").replace(/^\/+/, "");
}

function renderGrid(p) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    const total = curButtons.length + 1 + (inFolder ? 1 : 0);
    let cols;
    switch (p.layout_mode) {
        case "vertical1":   cols = 1; break;
        case "horizontal1": cols = total; break;
        case "horizontal2": cols = Math.ceil(total / 2); break;
        default:            cols = 2;
    }
    grid.style.gridTemplateColumns = `repeat(${cols}, var(--btn))`;

    // 뒤로가기 (폴더 안)
    if (inFolder) {
        const back = document.createElement("div");
        back.className = "back";
        back.textContent = "↩";
        back.title = "뒤로";
        back.addEventListener("click", () => bridge && bridge.exit_folder(function(){}));
        grid.appendChild(back);
    }

    // 버튼들
    curButtons.forEach((btn, idx) => {
        const el = document.createElement("div");
        el.className = "btn";
        el.dataset.idx = idx;
        el.draggable = true;

        // 배경색: 버튼 지정색 우선, 텍스트는 명도로 자동 선택
        const bgc = btn.color;
        if (bgc) {
            el.style.background = bgc;
            el.style.color = luminance(bgc) > 0.55 ? "#1f2430" : "#f5f6fa";
        }

        let iconHtml;
        if (btn.action_type === "folder_group") {
            const t = (CFG && CFG.theme_data) || {};
            const colors = t.folder_colors || ["#f87171", "#fbbf24", "#4ade80", "#60a5fa"];
            iconHtml = '<div class="folder-quad">' +
                colors.map(c => `<i style="background:${c}"></i>`).join("") + "</div>";
        } else if (btn.icon_image) {
            iconHtml = `<span class="icon"><img src="${fileUrl(btn.icon_image)}" alt=""></span>`;
        } else {
            iconHtml = `<span class="icon">${escapeHtml(btn.icon || "🔘")}</span>`;
        }
        const sub = btn.action_type === "folder_group"
            ? `${(btn.buttons || []).length}개`
            : "";
        el.innerHTML = iconHtml +
            `<span class="label">${escapeHtml(btn.label || "")}</span>` +
            (sub ? `<span class="sub">${escapeHtml(sub)}</span>` : "");

        el.addEventListener("click", () => bridge && bridge.run_action(idx, function(){}));
        el.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            bridge && bridge.show_edit_menu(idx, function(){});
        });

        // 드래그 재정렬
        el.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/sd-idx", String(idx));
            e.dataTransfer.effectAllowed = "move";
            el.classList.add("drag-src");
        });
        el.addEventListener("dragend", () => {
            el.classList.remove("drag-src");
            grid.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over"));
        });
        el.addEventListener("dragover", (e) => {
            if (e.dataTransfer.types.includes("text/sd-idx")) {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                el.classList.add("drag-over");
            }
        });
        el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
        el.addEventListener("drop", (e) => {
            const from = e.dataTransfer.getData("text/sd-idx");
            if (from === "") return;
            e.preventDefault();
            el.classList.remove("drag-over");
            const i = parseInt(from, 10), j = idx;
            if (i !== j && bridge) bridge.swap_buttons(i, j, function(){});
        });

        grid.appendChild(el);
    });

    // +버튼 (마스코트 장면의 앵커)
    const wrap = document.createElement("div");
    wrap.className = "plus-wrap";
    wrap.id = "plus-wrap";
    const plus = document.createElement("div");
    plus.className = "plus";
    plus.id = "plus";
    plus.textContent = "+";
    plus.title = "버튼 추가";
    plus.addEventListener("click", () => bridge && bridge.add_button(function(){}));
    wrap.appendChild(plus);
    grid.appendChild(wrap);

    mountMascot();
}

/* ═══════════════════════════════════════════════════════════════
   외부 파일 드래그 하이라이트 (PyQt eventFilter → dragHoverAt/Clear)
   ═══════════════════════════════════════════════════════════════ */
window.dragHoverAt = function (x, y) {
    const plus = document.getElementById("plus");
    if (!plus) return;
    const r = plus.getBoundingClientRect();
    const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    plus.classList.toggle("drop-target", inside);
};
window.dragHoverClear = function () {
    const plus = document.getElementById("plus");
    if (plus) plus.classList.remove("drop-target");
};

/* ═══════════════════════════════════════════════════════════════
   최소화/꽃잎 정지 (Python → setMinimized / setPetalsPaused)
   ═══════════════════════════════════════════════════════════════ */
window.setMinimized = function (on) {
    document.body.classList.toggle("minimized", !!on);
};
window.setPetalsPaused = function (on) {
    decoPaused = !!on;
    document.body.classList.toggle("petals-paused", decoPaused);
};

/* ═══════════════════════════════════════════════════════════════
   계절 장식
   ═══════════════════════════════════════════════════════════════ */
const SEASONS = {
    sakura: { particle: "🌸", count: 6, minDur: 6, maxDur: 11 },
    autumn: { particle: "🍂", count: 6, minDur: 6, maxDur: 11 },
    winter: { particle: "❄",  count: 9, minDur: 7, maxDur: 13 },
    summer: { particle: null },   // 파도만
};

function clearMascotTimers() {
    mascotTimers.forEach(clearTimeout);
    mascotTimers = [];
}

function setupSeason(themeKey) {
    const layer = document.getElementById("season-layer");
    layer.innerHTML = "";
    clearMascotTimers();
    const s = SEASONS[themeKey];
    if (!s) return;   // 계절 테마 아님

    if (s.particle) {
        for (let i = 0; i < s.count; i++) {
            const sp = document.createElement("span");
            sp.className = "particle";
            sp.textContent = s.particle;
            const size = 7 + Math.random() * 6;
            sp.style.fontSize = size + "px";
            sp.style.left = (Math.random() * 96) + "%";
            sp.style.setProperty("--drift", (Math.random() * 60 - 40) + "px");
            sp.style.setProperty("--fall", "110vh");
            sp.style.setProperty("--spin", (120 + Math.random() * 240) + "deg");
            sp.style.animationDuration = (s.minDur + Math.random() * (s.maxDur - s.minDur)) + "s";
            sp.style.animationDelay = (-Math.random() * s.maxDur) + "s";
            if (themeKey === "winter") sp.style.color = "#9ec5e8";
            layer.appendChild(sp);
        }
    }
    if (themeKey === "summer") {
        const w1 = document.createElement("div"); w1.className = "wave";
        const w2 = document.createElement("div"); w2.className = "wave w2";
        layer.appendChild(w1); layer.appendChild(w2);
    }
}

/* 마스코트 — +버튼 우측 하단 앵커 (renderGrid 후 호출) */
function mountMascot() {
    clearMascotTimers();
    const wrap = document.getElementById("plus-wrap");
    if (!wrap || !CFG) return;
    const theme = CFG.theme;
    const old = wrap.querySelector(".mascot-scene");
    if (old) old.remove();

    let html = "";
    if (theme === "sakura") {
        html = `<div class="mascot-scene scene-spring">
            <img class="branch" src="aessets/branch.png" alt="">
            <span class="bird" id="mascot-bird"><img src="aessets/bird.png" alt="" style="width:100%"></span>
        </div>`;
    } else if (theme === "summer") {
        html = `<div class="mascot-scene scene-summer">
            <img class="dolphin" id="mascot-dolphin" src="aessets/dolphin.png" alt="">
            <span class="palm">🌴</span>
        </div>`;
    } else if (theme === "autumn") {
        html = `<div class="mascot-scene scene-autumn">
            <img class="acorn" id="mascot-acorn" src="aessets/acorn.png" alt="">
            <img class="squirrel" src="aessets/squirrel.png" alt="">
        </div>`;
    } else if (theme === "winter") {
        html = `<div class="mascot-scene scene-winter">
            <img class="penguin" id="mascot-penguin" src="aessets/penguin.png" alt="">
        </div>`;
    }
    if (!html) return;
    wrap.insertAdjacentHTML("beforeend", html);
    scheduleMascot(theme);
}

function scheduleMascot(theme) {
    const later = (fn, ms) => { mascotTimers.push(setTimeout(fn, ms)); };
    const pauseGap = () => 3500 + Math.random() * 3500;

    if (theme === "sakura") {
        // 확정 연출: 스르륵 나타남(0.55s) → 앉아있기(2.8s) → 서서히 사라짐(1.8s) → 반복
        const cycle = () => {
            const bird = document.getElementById("mascot-bird");
            if (!bird) return;
            if (decoPaused || document.body.classList.contains("minimized")) {
                later(cycle, 2000); return;
            }
            const setS = (c) => { bird.className = "bird" + (c ? " " + c : ""); void bird.offsetWidth; };
            setS("appear");
            later(() => setS("idle"), 600);
            later(() => setS("fade-out"), 3400);
            later(() => { setS(""); later(cycle, pauseGap()); }, 5300);
        };
        later(cycle, 900);
    } else if (theme === "summer") {
        const cycle = () => {
            const d = document.getElementById("mascot-dolphin");
            if (!d) return;
            if (decoPaused || document.body.classList.contains("minimized")) {
                later(cycle, 2000); return;
            }
            d.classList.remove("jump"); void d.offsetWidth; d.classList.add("jump");
            later(cycle, 1600 + pauseGap());
        };
        later(cycle, 1200);
    } else if (theme === "autumn") {
        const cycle = () => {
            const a = document.getElementById("mascot-acorn");
            if (!a) return;
            if (decoPaused || document.body.classList.contains("minimized")) {
                later(cycle, 2000); return;
            }
            a.classList.remove("drop"); void a.offsetWidth; a.classList.add("drop");
            later(cycle, 1500 + pauseGap());
        };
        later(cycle, 1400);
    } else if (theme === "winter") {
        const cycle = () => {
            const pg = document.getElementById("mascot-penguin");
            if (!pg) return;
            if (decoPaused || document.body.classList.contains("minimized")) {
                later(cycle, 2000); return;
            }
            pg.classList.remove("waddle"); void pg.offsetWidth; pg.classList.add("waddle");
            later(cycle, 5500 + pauseGap());
        };
        later(cycle, 1000);
    }
}

/* ═══════════════════════════════════════════════════════════════
   헤더 버튼 + 윈도우 드래그
   ═══════════════════════════════════════════════════════════════ */
document.getElementById("btn-pin").addEventListener("click", function () {
    const el = this;
    bridge && bridge.toggle_pin(function (pinned) { el.classList.toggle("pinned", !!pinned); });
});
document.getElementById("btn-settings").addEventListener("click",
    () => bridge && bridge.open_settings(function(){}));
document.getElementById("btn-min").addEventListener("click",
    () => bridge && bridge.minimize_to_tray(function(){}));
document.getElementById("btn-close").addEventListener("click",
    () => bridge && bridge.quit_app(function(){}));

(function headerDrag() {
    const header = document.getElementById("header");
    let dragging = false, lastX = 0, lastY = 0;
    header.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || e.target.closest(".hbtn")) return;
        dragging = true;
        lastX = e.screenX; lastY = e.screenY;
        e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const dx = e.screenX - lastX, dy = e.screenY - lastY;
        if (dx || dy) {
            lastX = e.screenX; lastY = e.screenY;
            bridge && bridge.move_window_by(dx, dy);
        }
    });
    window.addEventListener("mouseup", () => {
        if (dragging) {
            dragging = false;
            bridge && bridge.save_window_pos();
        }
    });
})();

/* ═══════════════════════════════════════════════════════════════
   인트로 시퀀스 (main_qtweb start_intro와 호흡 맞춤)
   ═══════════════════════════════════════════════════════════════ */
let introCoords = null;

window.setupIntro = function (c) {
    introCoords = c;
    document.body.classList.add("intro");
    const holder = document.getElementById("widget-holder");
    holder.style.left = c.wx + "px";
    holder.style.top = c.wy + "px";
    holder.style.width = c.ww + "px";
    holder.style.height = c.wh + "px";
    holder.style.inset = "auto";
    holder.style.transform = `scale(${c.ws0})`;
    holder.style.transformOrigin = "0 50%";
    holder.style.opacity = "0";
    holder.style.transition = "none";

    const icon = document.getElementById("intro-icon");
    icon.style.display = "block";
    icon.style.width = c.base + "px";
    icon.style.height = c.base + "px";
    icon.style.left = (c.icx - c.base / 2) + "px";
    icon.style.top = (c.icy - c.base / 2) + "px";
    icon.style.transform = `scale(${c.s0})`;
    icon.style.opacity = "1";
    icon.style.transition = "none";
};

window.playIntroMove = function () {
    if (!introCoords) return;
    const c = introCoords;
    const icon = document.getElementById("intro-icon");
    icon.style.transition = "transform .62s cubic-bezier(.3,.7,.3,1)";
    icon.style.transform = `translate(${c.dx}px, ${c.dy}px) scale(${c.s1})`;
};

window.introBuild = function () {
    const holder = document.getElementById("widget-holder");
    holder.style.transition = "transform .55s cubic-bezier(.25,.8,.3,1), opacity .4s ease";
    holder.style.transform = "scale(1)";
    holder.style.opacity = "1";
    document.body.classList.remove("intro");
};

window.introIconFade = function () {
    const icon = document.getElementById("intro-icon");
    icon.style.transition = "opacity .3s ease";
    icon.style.opacity = "0";
};

window.introSettle = function () {
    const holder = document.getElementById("widget-holder");
    const icon = document.getElementById("intro-icon");
    icon.style.display = "none";
    holder.style.transition = "none";
    holder.style.transform = "none";
    holder.style.left = "0"; holder.style.top = "0";
    holder.style.width = "100%"; holder.style.height = "100%";
    holder.style.inset = "0";
    holder.style.opacity = "1";
    introCoords = null;
};

/* ═══════════════════════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════════════════════ */
connectBridge();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupportDeck — 빠른 실행 위젯</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--text:#f3f5fb;--muted:#aeb6cc;--faint:#7c85a0;--line:rgba(255,255,255,.12);}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:#070912;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.bg{position:fixed;inset:0;z-index:-2;background:#070912;overflow:hidden;}
.blob{position:absolute;width:48vw;height:48vw;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:screen;}
.b1{background:#e8951a;top:-12%;left:-8%;animation:drift1 18s ease-in-out infinite;}
.b2{background:#2c6ad8;top:-6%;right:-10%;animation:drift2 22s ease-in-out infinite;}
.b3{background:#169aa2;bottom:-18%;left:18%;animation:drift3 20s ease-in-out infinite;}
.b4{background:#6a36d6;bottom:-14%;right:-6%;animation:drift1 24s ease-in-out infinite reverse;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7%,6%) scale(1.08)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,-7%) scale(1.15)}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 120%, rgba(7,9,18,.85), transparent 70%);}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px;}
.glass{background:rgba(255,255,255,.055);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;max-width:1040px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.3px;}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.nav-right{display:flex;align-items:center;gap:18px;}
.nav-right a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;}
.nav-right a:hover{color:#fff;}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
.lang button{background:none;border:none;color:var(--faint);font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;cursor:pointer;}
.lang button.on{background:rgba(255,255,255,.16);color:#fff;}
.hero{text-align:center;padding:72px 0 40px;}
.hero-icon{width:152px;height:152px;border-radius:36px;filter:drop-shadow(0 0 50px rgba(120,150,255,.4)) drop-shadow(0 20px 40px rgba(0,0,0,.5));animation:float 6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{font-size:clamp(40px,7.5vw,70px);font-weight:900;letter-spacing:-2px;margin:24px 0 8px;background:linear-gradient(100deg,#ffd486,#8cc0ff 40%,#93f1e8 65%,#cb9dff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero .tag{font-size:clamp(17px,2.6vw,22px);font-weight:600;}
.hero .sub{color:var(--muted);margin-top:8px;}
.dl{margin:32px 0 12px;display:flex;flex-direction:column;align-items:center;gap:13px;}
.btn-dl{display:inline-flex;align-items:center;gap:13px;background:linear-gradient(100deg,#ffd486,#a8b8ff 55%,#cb9dff);color:#0f1424;font-weight:800;font-size:17px;padding:16px 32px;border-radius:14px;text-decoration:none;box-shadow:0 0 36px rgba(150,170,255,.45),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .15s;}
.btn-dl:hover{transform:translateY(-2px);box-shadow:0 0 52px rgba(150,170,255,.6),inset 0 1px 0 rgba(255,255,255,.5);}
.btn-dl.disabled{background:rgba(255,255,255,.1);color:var(--faint);box-shadow:none;pointer-events:none;}
.btn-dl svg{width:20px;height:20px;}
.meta{display:flex;gap:13px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--faint);font-size:13px;font-family:'JetBrains Mono',monospace;}
.meta .dot{width:4px;height:4px;border-radius:50%;background:var(--faint);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;}
section{padding:54px 0;}
.sec-label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:8px;}
.sec-title{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.5px;margin-bottom:30px;}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.card{border-radius:20px;padding:26px;transition:transform .2s,border-color .2s;}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.22);}
.tile{width:40px;height:40px;border-radius:12px;margin-bottom:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 22px rgba(255,255,255,.14);}
.tile.amber{background:linear-gradient(160deg,#ffd486,#e89220);}
.tile.blue{background:linear-gradient(160deg,#8cc0ff,#2c6ad8);}
.tile.teal{background:linear-gradient(160deg,#93f1e8,#169aa2);}
.tile.purple{background:linear-gradient(160deg,#cb9dff,#6a36d6);}
.card h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.card p{color:var(--muted);font-size:14.5px;}
.whatsnew{border-radius:20px;padding:28px 30px;}
.whatsnew .row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.whatsnew .ver{font-size:22px;font-weight:800;}
.whatsnew .when{font-family:'JetBrains Mono',monospace;color:var(--faint);font-size:13px;}
.notes{list-style:none;display:flex;flex-direction:column;gap:9px;}
.notes li{display:flex;gap:11px;color:var(--muted);font-size:14.5px;}
.notes li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:9px;background:linear-gradient(135deg,#8cc0ff,#cb9dff);}
footer{border-top:1px solid var(--line);padding:30px 0 50px;text-align:center;color:var(--faint);font-size:13px;}
footer .fbrand{color:var(--muted);font-weight:700;}
@media(max-width:680px){.features{grid-template-columns:1fr;}.nav-right .navlink{display:none;}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<nav>
  <div class="brand"><img src="icon.png" alt=""><span>SupportDeck</span></div>
  <div class="nav-right">
    <a class="navlink" href="#features" data-i18n="nav_features">기능</a>
    <a class="navlink" href="#download" data-i18n="nav_download">다운로드</a>
    <div class="lang"><button id="lang-ko" class="on" onclick="setLang('ko')">KO</button><button id="lang-en" onclick="setLang('en')">EN</button></div>
  </div>
</nav>
<main class="wrap">
  <section class="hero" id="download">
    <img class="hero-icon" src="icon.png" alt="SupportDeck">
    <h1>SupportDeck</h1>
    <p class="tag" data-i18n="tag">데스크톱 어디서나, 자주 쓰는 것들을 한 번에.</p>
    <p class="sub" data-i18n="sub">빠른 실행 버튼을 모아두는 가벼운 데스크톱 위젯.</p>
    <div class="dl">
      <a id="dlBtn" class="btn-dl disabled" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M5 21h14"/></svg>
        <span id="dlText" data-i18n="loading">최신 버전 확인 중…</span>
      </a>
      <div class="meta">
        <span class="badge">⊞ <span data-i18n="os">Windows 10 / 11</span></span>
        <span id="metaVer"></span><span class="dot" id="metaSep1" style="display:none"></span><span id="metaSize"></span>
        <span class="dot"></span><span data-i18n="free">무료 · 설치형</span>
      </div>
    </div>
  </section>
  <section id="features">
    <div class="sec-label" data-i18n="feat_label">FEATURES</div>
    <h2 class="sec-title" data-i18n="feat_title">필요한 건 한 번의 클릭으로</h2>
    <div class="features">
      <div class="card glass"><div class="tile amber"></div><h3 data-i18n="f1_t"></h3><p data-i18n="f1_d"></p></div>
      <div class="card glass"><div class="tile blue"></div><h3 data-i18n="f2_t"></h3><p data-i18n="f2_d"></p></div>
      <div class="card glass"><div class="tile teal"></div><h3 data-i18n="f3_t"></h3><p data-i18n="f3_d"></p></div>
      <div class="card glass"><div class="tile purple"></div><h3 data-i18n="f4_t"></h3><p data-i18n="f4_d"></p></div>
    </div>
  </section>
  <section>
    <div class="sec-label" data-i18n="new_label">RELEASE</div>
    <h2 class="sec-title" data-i18n="whatsnew">새로운 버전</h2>
    <div class="whatsnew glass">
      <div class="row"><div class="ver" id="nnVer">—</div><div class="when" id="nnDate"></div></div>
      <ul class="notes" id="nnNotes"></ul>
    </div>
  </section>
</main>
<footer><div><span class="fbrand">SupportDeck</span> · <span data-i18n="footer">빠른 실행 데스크톱 위젯</span></div></footer>
<script>
const CONFIG={manifestUrl:'latest.json',fallback:{version:null,url:null}};
const I18N={
 ko:{nav_features:'기능',nav_download:'다운로드',tag:'데스크톱 어디서나, 자주 쓰는 것들을 한 번에.',sub:'빠른 실행 버튼을 모아두는 가벼운 데스크톱 위젯.',loading:'최신 버전 확인 중…',download:'다운로드',soon:'곧 제공 예정',os:'Windows 10 / 11',free:'무료 · 설치형',feat_label:'FEATURES',feat_title:'필요한 건 한 번의 클릭으로',f1_t:'빠른 실행 덱',f1_d:'자주 쓰는 앱·파일·폴더·URL을 버튼으로 모아 한 번에 실행해요.',f2_t:'드래그앤드롭',f2_d:'파일이나 링크를 위젯에 끌어다 놓으면 바로 바로가기가 추가돼요.',f3_t:'가장자리 최소화',f3_d:'화면 가장자리로 살짝 숨겼다가, 마우스를 가져가면 쏙 나타나요.',f4_t:'항상 위 · 테마',f4_d:'항상 위 고정, 투명도, 다양한 테마로 내 스타일대로 꾸며요.',new_label:'RELEASE',whatsnew:'새로운 버전',footer:'빠른 실행 데스크톱 위젯'},
 en:{nav_features:'Features',nav_download:'Download',tag:'Everything you reach for, one click away.',sub:'A lightweight desktop widget that gathers your quick-launch buttons.',loading:'Checking latest version…',download:'Download',soon:'Coming soon',os:'Windows 10 / 11',free:'Free · Installer',feat_label:'FEATURES',feat_title:'What you need, one click away',f1_t:'Quick-launch deck',f1_d:'Collect your apps, files, folders and URLs into buttons and launch in one click.',f2_t:'Drag & drop',f2_d:'Drop a file or link onto the widget to instantly add a shortcut.',f3_t:'Edge-minimize',f3_d:'Tuck it to the screen edge — it slides out when your cursor comes near.',f4_t:'Always on top · Themes',f4_d:'Pin on top, adjust opacity, and style it with themes your way.',new_label:'RELEASE',whatsnew:"What's new",footer:'Quick-launch desktop widget'}
};
let LANG='ko',MANIFEST=null;
function setLang(l){LANG=l;document.documentElement.lang=l;document.getElementById('lang-ko').classList.toggle('on',l==='ko');document.getElementById('lang-en').classList.toggle('on',l==='en');document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[l][k]!==undefined)el.textContent=I18N[l][k];});renderManifest();}
function renderManifest(){const t=I18N[LANG],btn=document.getElementById('dlBtn'),txt=document.getElementById('dlText');
 if(MANIFEST&&MANIFEST.url){btn.classList.remove('disabled');btn.href=MANIFEST.url;txt.textContent=t.download+(MANIFEST.version?'  v'+MANIFEST.version:'');document.getElementById('metaVer').textContent=MANIFEST.version?'v'+MANIFEST.version:'';if(MANIFEST.size){document.getElementById('metaSize').textContent=MANIFEST.size;document.getElementById('metaSep1').style.display='inline-block';}document.getElementById('nnVer').textContent=MANIFEST.version?'v'+MANIFEST.version:'—';document.getElementById('nnDate').textContent=MANIFEST.date||'';const notes=(LANG==='en'?MANIFEST.notes_en:MANIFEST.notes_ko)||MANIFEST.notes_ko||MANIFEST.notes_en||[];const ul=document.getElementById('nnNotes');ul.innerHTML='';notes.forEach(n=>{const li=document.createElement('li');li.textContent=n;ul.appendChild(li);});}
 else{btn.classList.add('disabled');btn.href='#';txt.textContent=t.soon;document.getElementById('nnVer').textContent='—';}}
async function loadManifest(){try{const r=await fetch(CONFIG.manifestUrl,{cache:'no-store'});if(!r.ok)throw 0;MANIFEST=await r.json();}catch(e){MANIFEST=CONFIG.fallback;}renderManifest();}
if((navigator.language||'').toLowerCase().indexOf('ko')!==0){LANG='en';}
setLang(LANG);loadManifest();
</script>
</body>
</html>
